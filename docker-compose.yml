services:
  db:
    image: postgres:15
    container_name: contatos_db
    environment:
      POSTGRES_DB: contatos
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    container_name: contatos_api
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://admin:admin@db:5432/contatos
      PORT: 3000
    volumes:
      - ./backend:/app
      - /app/node_modules

  web:
    build: ./frontend
    container_name: contatos_web
    expose:
      - "80"
    depends_on:
      - api

  # Nginx reverse proxy com SSL
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx-conf.d.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/cert.pem:/etc/nginx/cert.pem:ro
      - ./certs/key.pem:/etc/nginx/key.pem:ro
    depends_on:
      - web
      - api

volumes:
  postgres_data:
